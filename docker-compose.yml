services:
  tunetube:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    image: teampat/tunetube
    container_name: tunetube
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      YTDLP_COOKIES: /app/cookies/cookies.txt
      YTDLP_COOKIES_FROM_BROWSER: none
    volumes:
      # Put Netscape cookies at ./cookies/cookies.txt (must be a file).
      #   mkdir -p cookies
      #   yt-dlp --cookies-from-browser chrome --cookies cookies/cookies.txt --skip-download --simulate --no-playlist "https://www.youtube.com/watch?v=jNQXAC9IVRw"
      - ./cookies:/app/cookies:ro
      - audio-cache:/app/cache

volumes:
  audio-cache:
